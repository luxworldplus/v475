<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M€₺RIC — Universal Intelligence</title>
<!-- Dynamic SVG Favicon featuring the Turkish Lira (₺) -->
<link class="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23150022' stroke='%23a020f0' stroke-width='6'/><text y='72' x='50' font-size='60' font-weight='bold' font-family='sans-serif' fill='%23d46bff' text-anchor='middle'>₺</text></svg>">

<style>
    :root {
        --bg: #0a0014;
        --card: #150022;
        --text: #e6d6ff;
        --accent: #a020f0;
        --accent2: #d46bff;
        --slider-bg: #2a0040;
        --success: #10b981;
        --danger: #ef4444;
        --border-color: #3a0058;
        --shadow-color: rgba(0, 0, 0, 0.4);
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background 0.3s, color 0.3s;
    }

    .header-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        box-sizing: border-box;
        z-index: 10;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: var(--accent2);
        letter-spacing: 2px;
        text-shadow: 0 0 10px var(--accent);
    }

    .settings-trigger {
        background: var(--slider-bg);
        border: 1px solid var(--border-color);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: bold;
        transition: all 0.2s ease;
        width: auto;
        margin: 0;
    }

    .settings-trigger:hover {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent2);
    }

    .container {
        display: flex;
        width: 100%;
        min-height: 100vh;
        padding-top: 20px;
        box-sizing: border-box;
    }

    .left, .right {
        flex: 1;
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    .left {
        background: var(--card);
        border-right: 2px solid var(--border-color);
        padding-top: 80px;
    }

    .right {
        padding-top: 80px;
    }

    h1 {
        margin-top: 0;
        font-size: 32px;
        text-align: center;
        color: var(--accent2);
        text-shadow: 0 0 10px var(--accent);
    }

    .slider-container {
        display: flex;
        background: var(--slider-bg);
        border-radius: 8px;
        padding: 5px;
        margin-bottom: 20px;
        position: relative;
    }

    .tab {
        flex: 1;
        text-align: center;
        padding: 10px 0;
        cursor: pointer;
        font-weight: bold;
        color: var(--text);
        z-index: 1;
        transition: color 0.3s;
        font-size: 14px;
    }

    .slider-highlight {
        position: absolute;
        top: 5px;
        bottom: 5px;
        left: 5px;
        width: calc(20% - 2px);
        background: var(--accent);
        border-radius: 6px;
        transition: transform 0.3s ease;
        z-index: 0;
    }

    .input-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
    }

    input, select {
        flex-grow: 1;
        width: 100%;
        padding: 14px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        font-size: 16px;
        background: var(--slider-bg);
        color: var(--text);
        box-sizing: border-box;
        height: 52px;
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
    }
    input[type=number] {
        -moz-appearance: textfield;
    }

    .local-helper {
        font-size: 13px;
        margin-top: -6px;
        margin-bottom: 14px;
        padding-left: 2px;
        display: none;
        align-items: center;
        gap: 6px;
        animation: fadeIn 0.3s ease-out;
    }

    .local-helper-btn {
        color: var(--accent2);
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        font-size: 13px;
        text-decoration: underline;
        cursor: pointer;
        font-weight: bold;
        width: auto;
    }

    .local-helper-btn:hover {
        color: #fff;
        background: none;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .fav-pair-btn {
        background: var(--slider-bg);
        border: 1px solid var(--border-color);
        color: var(--text);
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 52px;
        border-radius: 6px;
        box-sizing: border-box;
    }

    .fav-pair-btn:hover {
        border-color: var(--accent2);
        color: var(--text);
    }

    .fav-pair-btn.active {
        color: #ffb700;
        border-color: #ffb700;
        text-shadow: 0 0 10px #ffb700;
        transform: scale(1.05);
    }

    .convert-row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
    }

    .convert-btn {
        flex-grow: 1;
        margin-bottom: 0 !important;
    }

    input::-webkit-calendar-picker-indicator {
        filter: invert(1);
        opacity: 0.5;
        cursor: pointer;
    }

    button {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        color: #fff;
        margin-bottom: 12px;
        transition: 0.2s;
        font-weight: bold;
    }

    button:hover {
        background: var(--accent2);
    }

    #result {
        margin-top: 10px;
        font-size: 22px;
        text-align: center;
        color: var(--accent2);
        min-height: 26px;
        word-wrap: break-word;
    }

    .right h2 {
        margin-top: 0;
        font-size: 28px;
        color: var(--accent2);
        text-shadow: 0 0 10px var(--accent);
    }

    /* =========================================
        TRENDS SPOTLIGHT CAROUSEL
       ========================================= */
    .carousel-section {
        margin-bottom: 25px;
    }

    .carousel-title {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text);
        opacity: 0.8;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .carousel-outer-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        position: relative;
        background: var(--card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 15px 10px;
        box-shadow: 0 4px 15px var(--shadow-color);
    }

    .carousel-container {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 120px;
    }

    .carousel-card {
        width: 100%;
        max-width: 240px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        cursor: pointer;
    }

    .carousel-nav-btn {
        background: var(--slider-bg);
        border: 1px solid var(--border-color);
        color: var(--text);
        font-size: 20px;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        margin: 0;
        padding: 0;
    }

    .carousel-nav-btn:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent2);
        box-shadow: 0 0 8px var(--accent);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .card-currency {
        font-weight: bold;
        font-size: 16px;
        color: var(--text);
    }

    .card-category-badge {
        font-size: 10px;
        text-transform: uppercase;
        background: var(--slider-bg);
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--accent2);
        font-weight: bold;
    }

    .card-actions {
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .card-action-btn {
        cursor: pointer;
        background: none;
        border: none;
        padding: 2px;
        margin: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        color: var(--text);
        opacity: 0.7;
        font-size: 14px;
        transition: color 0.2s;
    }

    .card-action-btn:hover {
        color: var(--accent2);
        background: none;
        opacity: 1;
    }

    .card-action-btn.delete:hover {
        color: var(--danger);
    }

    .card-rate {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
    }

    .card-inverse-rate {
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 10px;
    }

    .carousel-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 8px;
    }

    .carousel-dot {
        width: 6px;
        height: 6px;
        background: var(--border-color);
        border-radius: 50%;
        transition: background 0.3s;
        cursor: pointer;
    }

    .carousel-dot.active {
        background: var(--accent2);
        box-shadow: 0 0 6px var(--accent2);
    }

    /* =========================================
        LOGS & PERFORMANCE UTILITY CONTAINER
       ========================================= */
    .utility-box {
        margin-top: 10px;
        padding: 20px;
        background: var(--card);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        flex-grow: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        min-height: 250px;
    }

    .utility-header {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .utility-tab-btn {
        flex: 1;
        margin-bottom: 0;
        padding: 10px;
        font-size: 13px;
        background: var(--slider-bg);
        border: 1px solid var(--border-color);
        color: var(--text);
        border-radius: 6px;
        cursor: pointer;
    }

    .utility-tab-btn.active {
        background: var(--accent);
        border-color: var(--accent2);
        color: #fff;
        box-shadow: 0 0 8px var(--accent);
    }

    .panel-view {
        flex-grow: 1;
        overflow-y: auto;
        font-size: 13px;
    }

    .hub-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
    }

    .hub-table th, .hub-table td {
        padding: 8px;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
    }

    .hub-table th {
        color: var(--accent2);
        font-weight: bold;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .hub-table tr:hover {
        background: rgba(160, 32, 240, 0.05);
    }

    .hub-load-btn {
        background: var(--accent);
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 4px;
        margin: 0;
        width: auto;
        display: inline-block;
        color: #fff;
        border: none;
        font-weight: bold;
    }

    /* Manual Record Action Panel */
    .record-action-container {
        display: none;
        margin-bottom: 12px;
        animation: fadeIn 0.3s ease-out;
    }

    .record-btn {
        background: var(--success);
        margin-bottom: 0;
    }

    .record-btn:hover {
        background: #059669;
    }

    .record-btn:disabled {
        background: #34495e !important;
        cursor: not-allowed;
        opacity: 0.6;
    }

    /* Real-Time Sparkline styling */
    .trend-sparkline-mini {
        width: 60px;
        height: 20px;
        stroke: var(--success);
        stroke-width: 1.5;
        fill: none;
    }

    .empty-prompt {
        padding: 20px;
        font-style: italic;
        opacity: 0.7;
        text-align: center;
    }

    /* =========================================
        SETTINGS OVERLAY MODAL
       ========================================= */
    .settings-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
        animation: fadeIn 0.2s ease-out;
    }

    .settings-panel {
        background: var(--card);
        border: 2px solid var(--border-color);
        border-radius: 14px;
        width: 90%;
        max-width: 500px;
        padding: 25px;
        box-sizing: border-box;
        box-shadow: 0 10px 30px var(--shadow-color);
    }

    .settings-title {
        font-size: 22px;
        color: var(--accent2);
        margin-top: 0;
        margin-bottom: 20px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .settings-close {
        font-size: 24px;
        background: none;
        border: none;
        color: var(--text);
        cursor: pointer;
        padding: 0;
        width: auto;
        margin: 0;
    }

    .setting-group {
        margin-bottom: 18px;
    }

    .setting-label {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 8px;
        color: var(--text);
        display: block;
    }

    .theme-button-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }

    .theme-btn {
        background: var(--slider-bg);
        border: 1px solid var(--border-color);
        color: var(--text);
        padding: 10px 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 0;
        transition: all 0.2s ease;
    }

    .theme-btn.active {
        background: var(--accent);
        border-color: var(--accent2);
        color: #fff;
    }

    .custom-color-row {
        display: none;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        animation: fadeIn 0.2s ease-out;
    }

    .custom-color-input {
        width: 44px;
        height: 34px;
        padding: 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: none;
    }

    .plot-setting-options {
        display: flex;
        gap: 12px;
    }

    .plot-opt {
        flex: 1;
        background: var(--slider-bg);
        border: 1px solid var(--border-color);
        color: var(--text);
        padding: 12px;
        border-radius: 6px;
        text-align: center;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
    }

    .plot-opt.active {
        background: var(--accent);
        border-color: var(--accent2);
        color: #fff;
    }

    .reset-btn {
        background: var(--danger);
        margin-top: 10px;
    }

    .reset-btn:hover {
        background: #dc2626;
    }

    /* Notification banner */
    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--card);
        border-left: 5px solid var(--accent);
        padding: 12px 24px;
        border-radius: 4px;
        color: var(--text);
        box-shadow: 0 4px 12px var(--shadow-color);
        display: none;
        z-index: 1000;
        animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* =========================================
        MOBILE RESPONSIVENESS
       ========================================= */
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
            min-height: auto;
        }

        .left {
            border-right: none;
            border-bottom: 2px solid var(--border-color);
            padding: 70px 20px 30px 20px;
        }

        .right {
            padding: 30px 20px;
        }

        .header-bar {
            background: var(--bg);
            padding: 10px 15px;
        }

        .logo {
            font-size: 20px;
        }
    }
</style>
</head>

<body>

<div class="header-bar">
    <div class="logo">M€₺RIC by LUXWORLD+</div>
    <button class="settings-trigger" id="openSettingsBtn">⚙️ Settings</button>
</div>

<div class="container">

    <div class="left">
        <h1 id="mainTitle">Currency Converter</h1>

        <div class="slider-container">
            <div class="slider-highlight" id="sliderHighlight"></div>
            <div class="tab" onclick="setCategory('Currency', 0)">Currency</div>
            <div class="tab" onclick="setCategory('Length', 1)">Length</div>
            <div class="tab" onclick="setCategory('Weight', 2)">Weight</div>
            <div class="tab" onclick="setCategory('Volume', 3)">Volume</div>
            <div class="tab" onclick="setCategory('Temp', 4)">Temp</div>
        </div>

        <div class="input-row">
            <input id="amount" type="number" placeholder="Amount">
        </div>
        
        <div class="input-row">
            <input id="from" list="fromList" placeholder="From (Type to search)">
            <datalist id="fromList"></datalist>
        </div>

        <div class="local-helper" id="localHelper">
            <span style="color: var(--text); opacity: 0.8;">Not your local currency?</span>
            <button id="useDetectedLocalCurrency" class="local-helper-btn">Change it to <span id="detectedLocalCode">USD</span></button>
        </div>

        <div class="input-row">
            <input id="to" list="toList" placeholder="To (Type to search)">
            <datalist id="toList"></datalist>
        </div>

        <div class="convert-row">
            <button id="convert" class="convert-btn">Convert</button>
            <button id="swapBtn" class="fav-pair-btn" title="Swap inputs">⇅</button>
            <button id="favPairBtn" class="fav-pair-btn" title="Add pair to favorites">★</button>
        </div>

        <div id="result"></div>
    </div>

    <div class="right">
        <!-- TRENDS SPOTLIGHT CAROUSEL -->
        <div class="carousel-section">
            <div class="carousel-title">
                <span>Favorite Custom Trends</span>
                <span id="carouselTimerLabel" style="font-size: 11px; opacity: 0.7;">Active live rates</span>
            </div>
            
            <div class="carousel-outer-wrapper">
                <button class="carousel-nav-btn" id="carouselPrevBtn" title="Previous Trend">&lsaquo;</button>
                
                <div class="carousel-container" id="carouselContainer">
                    <!-- Dynamically populated spotlight card -->
                </div>

                <button class="carousel-nav-btn" id="carouselNextBtn" title="Next Trend">&rsaquo;</button>
            </div>
            
            <div class="carousel-dots" id="carouselDots">
                <!-- Dot indicator tags -->
            </div>
        </div>

        <h2 id="hubTitle">Performance & Logs</h2>

        <div class="utility-box">
            <!-- Manual plotting trigger section -->
            <div class="record-action-container" id="recordActionContainer">
                <button id="recordCurrentRatesBtn" class="record-btn" title="Log current currency rates to history log">📈 Record Current Rates as Session</button>
            </div>

            <div class="utility-header">
                <button id="tabFavorites" class="utility-tab-btn active">📋 Registry & Inverses</button>
                <button id="tabHistory" class="utility-tab-btn">🕒 Session History</button>
            </div>
            <div class="panel-view" id="panelView">
                <!-- Swapped dynamic content displays here -->
            </div>
        </div>
    </div>

</div>

<!-- SETTINGS MODAL -->
<div class="settings-modal" id="settingsModal">
    <div class="settings-panel">
        <div class="settings-title">
            <span>⚙️ Configuration Board</span>
            <button class="settings-close" id="closeSettingsBtn">&times;</button>
        </div>

        <div class="setting-group">
            <label class="setting-label">Visual Interface Palette</label>
            <div class="theme-button-grid">
                <button class="theme-btn" id="themePink">Pink</button>
                <button class="theme-btn" id="themeWhite">White</button>
                <button class="theme-btn" id="themeBlack">Black</button>
                <button class="theme-btn" id="themeCustom">Custom</button>
            </div>
            <div class="custom-color-row" id="customColorRow">
                <span style="font-size: 13px;">Accent Color:</span>
                <input type="color" class="custom-color-input" id="customAccentPicker" value="#a020f0">
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-label">Session Plotting Sequence</label>
            <div class="plot-setting-options">
                <div class="plot-opt" id="plotOptAuto" title="Automatically save snapshot on startup">Auto Plot</div>
                <div class="plot-opt" id="plotOptManual" title="Plot manually via utility button">Manual Plot</div>
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-label">Default Landing Section</label>
            <select id="startSectionSelect">
                <option value="Currency">Currency</option>
                <option value="Length">Length</option>
                <option value="Weight">Weight</option>
                <option value="Volume">Volume</option>
                <option value="Temp">Temp</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">History Snapshot Cap</label>
            <input type="number" id="historyCapInput" min="3" max="15" value="7">
        </div>

        <div class="setting-group" style="margin-top: 30px;">
            <button class="reset-btn" id="resetSystemBtn">⚠️ Reset Cache & Defaults</button>
        </div>
    </div>
</div>

<div class="toast" id="toastMessage">Logged current session successfully!</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const API = "https://open.er-api.com/v6/latest/";
    
    // UI Elements
    const fromInput = document.getElementById("from");
    const toInput = document.getElementById("to");
    const fromList = document.getElementById("fromList");
    const toList = document.getElementById("toList");
    const amountInput = document.getElementById("amount");
    const resultBox = document.getElementById("result");
    const mainTitle = document.getElementById("mainTitle");
    const sliderHighlight = document.getElementById("sliderHighlight");
    const carouselContainer = document.getElementById("carouselContainer");

    // Dynamic Accent lightener formula to yield matching color accents
    function lightenHex(hex, percent) {
        let num = parseInt(hex.replace("#",""), 16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            G = (num >> 8 & 0x00FF) + amt,
            B = (num & 0x0000FF) + amt;
        return "#" + (0x1000000 + (R < 255 ? R < 0 ? 0 : R : 255) * 0x10000 + (G < 255 ? G < 0 ? 0 : G : 255) * 0x100 + (B < 255 ? B < 0 ? 0 : B : 255)).toString(16).slice(1);
    }

    function toggleFavoriteCurrentPair() {

    function calculateLiveRate(category, from, to) {
        if (category === "Currency") {
            if (!latestRates[from] || !latestRates[to]) return "N/A";
            return (latestRates[to] / latestRates[from]).toFixed(4);
        } else if (category === "Temp") {
            return "Convert";
        } else {
            const baseRates = units[category];
            if (!baseRates || !baseRates[from] || !baseRates[to]) return "N/A";
            const rate = baseRates[from] / baseRates[to];
            return rate < 0.001 ? rate.toExponential(4) : rate.toFixed(4);
        }
    }

    // Render historical trend lines from session logs
    function generateRealHistorySparkline(favKey) {
        let historyRates = sessionHistory
            .slice()
            .reverse()
            .map(s => parseFloat(s.rates[favKey]))
            .filter(val => !isNaN(val) && isFinite(val));

        const fallbackRate = parseFloat(calculateLiveRate("Currency", parsePairKey(favKey).from, parsePairKey(favKey).to));

        if (historyRates.length === 0) {
            historyRates = [fallbackRate, fallbackRate];
        } else if (historyRates.length === 1) {
            historyRates.unshift(historyRates[0]);
        }

        const latest = historyRates[historyRates.length - 1];
        const oldest = historyRates[0];
        const isUp = latest >= oldest;

        const minY = Math.min(...historyRates);
        const maxY = Math.max(...historyRates);
        const range = maxY - minY || 1;

        const points = historyRates.map((rate, i) => {
            const x = (i / (historyRates.length - 1)) * 100;
            const y = 22 - ((rate - minY) / range) * 19; 
            return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(" ");

        return { points, isUp };
    }

        if (currentTrendIndex >= favorites.length) {

        const favKey = favorites[currentTrendIndex];
        const { category, from, to } = parsePairKey(favKey);
        const liveRate = calculateLiveRate(category, from, to);

        const trendData = generateRealHistorySparkline(favKey);

        const card = document.createElement("div");
        card.className = "carousel-card";
        
        card.innerHTML = `

                <div class="card-actions">

            </div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <div class="card-rate">1 ${from} = ${liveRate}</div>

                <svg viewBox="0 0 100 25" style="width: 80px; height: 24px; margin-bottom: 8px;">

    async function convert() {
        const amount = parseFloat(amountInput.value);
        if (isNaN(amount)) return resultBox.textContent = "Enter a valid amount";

        const from = fromInput.value;
        const to = toInput.value;
        let converted = 0;

        if (currentCategory === "Currency") {
            if (!currencyList.includes(from) || !currencyList.includes(to)) {
                return resultBox.textContent = "Please select valid currency codes.";
            }
            try {
                const res = await fetch(API + from);
                const data = await res.json();
                const rate = data.rates[to];
                if (!rate) throw new Error("Invalid rate");
                converted = amount * rate;
            } catch {
                return resultBox.textContent = "Conversion API Error.";
            }
        } 
        else if (currentCategory === "Length" || currentCategory === "Weight" || currentCategory === "Volume") {
            const baseRates = units[currentCategory];
            if (!baseRates[from] || !baseRates[to]) {
                return resultBox.textContent = "Please select valid units from the dropdown.";
            }
            const valInBase = amount * baseRates[from]; 
            converted = valInBase / baseRates[to];      
        } 
        else if (currentCategory === "Temp") {
            if (!units.Temp.includes(from) || !units.Temp.includes(to)) {
                return resultBox.textContent = "Please select valid temperatures.";
            }
            if (from === to) converted = amount;
            else if (from === "Celsius" && to === "Fahrenheit") converted = (amount * 9/5) + 32;
            else if (from === "Celsius" && to === "Kelvin") converted = amount + 273.15;
            else if (from === "Fahrenheit" && to === "Celsius") converted = (amount - 32) * 5/9;
            else if (from === "Fahrenheit" && to === "Kelvin") converted = (amount - 32) * 5/9 + 273.15;
            else if (from === "Kelvin" && to === "Celsius") converted = amount - 273.15;
            else if (from === "Kelvin" && to === "Fahrenheit") converted = (amount - 273.15) * 9/5 + 32;
        }

        let formattedStr = converted;
        if (currentCategory === "Currency") {
            formattedStr = converted.toFixed(2);
        } else {
            formattedStr = Math.round(converted * 100000000) / 100000000;
        }

        resultBox.textContent = `${amount} ${from} = ${formattedStr} ${to}`;
        saveState();
    }

    async function detectLocalCurrency() {
        try {
            const res = await fetch("https://ipapi.co/json/");
            if (!res.ok) throw new Error("Geo IP service unreachable");
            const data = await res.json();
            if (data && data.currency) {
                return data.currency;
            }
        } catch (err) {
            console.warn("Could not determine local currency via IP, using standard fallback:", err);
        }
        return "USD";
    }

    function recordSessionSnapshot(isManual = false) {
        // Enforce manual check - only plot if currency is the active tab today
        if (isManual && currentCategory !== "Currency") {
            showToast("Can only record session rates while in Currency mode.");
            return;
        }

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = new Date().toLocaleDateString([], { month: 'short', day: 'numeric' });
        
        const snapshot = {
            sessionLabel: `${dateStr} @ ${timeStr}`,
            rates: {}
        };

        favorites.forEach(favKey => {
            const { category, from, to } = parsePairKey(favKey);
            snapshot.rates[favKey] = calculateLiveRate(category, from, to);
        });

        // Do not add empty snapshot if there are no favorites
        if (favorites.length === 0) {
            if (isManual) {
                showToast("Please star at least one currency pair first!");
            }
            return;
        }

        // De-duplication algorithm matching exact threshold shifts
        if (sessionHistory.length > 0) {
            const lastSession = sessionHistory[0];
            
            const lastKeys = Object.keys(lastSession.rates || {});
            const currentKeys = Object.keys(snapshot.rates);
            const keysChanged = lastKeys.length !== currentKeys.length || !currentKeys.every(k => lastKeys.includes(k));

            let rateChanged = false;

            if (keysChanged) {
                rateChanged = true;
            } else {
                for (const favKey of favorites) {
                    const prevVal = parseFloat(lastSession.rates[favKey]);
                    const newVal = parseFloat(snapshot.rates[favKey]);

                    if (!isNaN(prevVal) && !isNaN(newVal)) {
                        if (Math.abs(newVal - prevVal) > 0.00001) {
                            rateChanged = true;
                            break;
                        }
                    } else if (isNaN(prevVal) && !isNaN(newVal)) {
                        rateChanged = true;
                        break;
                    }
                }
            }

            // Reject duplicate auto plot snapshots, but allow user overrides on manual plot
            if (!rateChanged && !isManual) {
                console.log("Ignored identical session to protect historical logs from duplicate auto-opens.");
                return;
            }
        }

        sessionHistory.unshift(snapshot);
        // Bind length cap based on settings variable
        if (sessionHistory.length > sessionCap) {
            sessionHistory = sessionHistory.slice(0, sessionCap);
        }

        localStorage.setItem("metric_session_history", JSON.stringify(sessionHistory));
        
        if (isManual) {
            showToast("Rates logged successfully!");
            renderActivePanel();
            renderTrendsCarousel();
        }
    }

    function renderActivePanel() {
        panelView.innerHTML = "";
        
        if (activeHubTab === "favorites") {
            tabFavorites.classList.add("active");
            tabHistory.classList.remove("active");

            if (favorites.length === 0) {
                panelView.innerHTML = `<div class="empty-prompt">No custom favorite registry items are currently tracked.</div>`;
                return;
            }

            const table = document.createElement("table");
            table.className = "hub-table";
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Saved Unit Pair</th>
                        <th>Direct Value</th>
                        <th>Inverse Value</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="favTableBody"></tbody>
            `;

            panelView.appendChild(table);
            const tbody = document.getElementById("favTableBody");

            favorites.forEach(favKey => {
                const { category, from, to } = parsePairKey(favKey);
                const directVal = calculateLiveRate(category, from, to);
                const inverseVal = calculateLiveRate(category, to, from);

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td style="font-weight:bold; color:var(--text);">${from} ➔ ${to}</td>
                    <td>1 = ${directVal}</td>
                    <td>1 = ${inverseVal}</td>
                    <td><button class="hub-load-btn" data-key="${favKey}">Load</button></td>
                `;

                row.querySelector(".hub-load-btn").addEventListener("click", () => {
                    const activeIndex = categoryIndexes[category] ?? 0;
                    setCategory(category, activeIndex, false);
                    populateSelects(category === "Currency" ? currencyList : (category === "Temp" ? units.Temp : Object.keys(units[category])), from, to);
                    saveState();
                    updateFavoriteStars();
                    evalLocalCurrencyShortcut();
                });

                tbody.appendChild(row);
            });

        } else if (activeHubTab === "history") {
            tabFavorites.classList.remove("active");
            tabHistory.classList.add("active");

            if (favorites.length === 0) {
                panelView.innerHTML = `<div class="empty-prompt">No saved favorite pairs. Star conversions to log loading trends.</div>`;
                return;
            }

            if (sessionHistory.length === 0) {
                panelView.innerHTML = `<div class="empty-prompt">No session logs captured. Tap "Record Current Rates" to plot rates!</div>`;
                return;
            }

            const table = document.createElement("table");
            table.className = "hub-table";
            
            let headerCells = `<th>Session Landmark</th>`;
            favorites.forEach(favKey => {
                const { from, to } = parsePairKey(favKey);
                headerCells += `<th>${from}/${to}</th>`;
            });

            table.innerHTML = `
                <thead>
                    <tr>${headerCells}</tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            `;

            panelView.appendChild(table);
            const tbody = document.getElementById("historyTableBody");

            sessionHistory.forEach(session => {
                const row = document.createElement("tr");
                let cells = `<td style="font-size:11px; opacity:0.8;">${session.sessionLabel}</td>`;
                
                favorites.forEach(favKey => {
                    const currentRecordedRate = (session.rates && session.rates[favKey] !== undefined) 
                        ? session.rates[favKey] 
                        : calculateLiveRate(parsePairKey(favKey).category, parsePairKey(favKey).from, parsePairKey(favKey).to);
                    cells += `<td>${currentRecordedRate}</td>`;
                });

                row.innerHTML = cells;
                tbody.appendChild(row);
            });
        }
    }

    async function initCurrencies() {
        try {
            // Apply loaded theme choices
            applyTheme(activeTheme);

            const res = await fetch(API + "USD");
            const data = await res.json();
            currencyList = Object.keys(data.rates);
            latestRates = data.rates;

            const savedFrom = localStorage.getItem(`metric_from_${currentCategory}`);
            const savedTo = localStorage.getItem(`metric_to_${currentCategory}`);
            const savedAmount = localStorage.getItem("metric_amount");

            if (savedAmount) amountInput.value = savedAmount;

            detectedLocalCurrency = await detectLocalCurrency();
            if (!currencyList.includes(detectedLocalCurrency)) {
                detectedLocalCurrency = "USD";
            }

            let initialFrom = savedFrom;
            
            if (!initialFrom && currentCategory === "Currency") {
                initialFrom = detectedLocalCurrency;
            } else if (!initialFrom) {
                initialFrom = currentCategory === "Length" ? "Meters" :
                              currentCategory === "Weight" ? "Kilograms" :
                              currentCategory === "Volume" ? "Liters" : "Celsius";
            }

            // Read the Default Start Category setting if clean boot
            if (!localStorage.getItem("metric_category") && defaultStartingTab) {
                currentCategory = defaultStartingTab;
            }

            const activeIndex = categoryIndexes[currentCategory] ?? 0;
            setCategory(currentCategory, activeIndex, false); 

            if (currentCategory === "Currency") {
                populateSelects(currencyList, initialFrom, savedTo || "EUR");
                evalLocalCurrencyShortcut();
            }

            // Plot automatically only if plot settings dictate "auto"
            if (plottingMode === "auto") {
                recordSessionSnapshot();
            }

            updateFavoriteStars();
            renderTrendsCarousel();
            renderActivePanel();
            setupAutoplay();
            configurePlottingControls();

        } catch (e) {
            resultBox.textContent = "Error loading currencies. Check network connection.";
        }
    }

    useDetectedLocalCurrencyBtn.addEventListener("click", () => {
        fromInput.value = detectedLocalCurrency;
        saveState();
        evalLocalCurrencyShortcut();
        updateFavoriteStars();
        if (amountInput.value) {
            convert();
        }
    });

    swapBtn.addEventListener("click", () => {
        const temp = fromInput.value;
        fromInput.value = toInput.value;
        toInput.value = temp;
        saveState();
        updateFavoriteStars();
        evalLocalCurrencyShortcut();
        if (amountInput.value) {
            convert();
        }
    });

    amountInput.addEventListener("input", saveState);
    fromInput.addEventListener("input", () => {
        saveState();
        updateFavoriteStars();
        evalLocalCurrencyShortcut();
    });
    toInput.addEventListener("input", () => {
        saveState();
        updateFavoriteStars();
    });

    favPairBtn.addEventListener("click", toggleFavoriteCurrentPair);
    carouselPrevBtn.addEventListener("click", () => handleManualNavigation(-1));
    carouselNextBtn.addEventListener("click", () => handleManualNavigation(1));

    tabFavorites.addEventListener("click", () => {
        activeHubTab = "favorites";
        renderActivePanel();
        configurePlottingControls();
    });

    tabHistory.addEventListener("click", () => {
        activeHubTab = "history";
        renderActivePanel();
        configurePlottingControls();
    });

    // Manual snapshot plotting trigger
    recordCurrentRatesBtn.addEventListener("click", () => {
        recordSessionSnapshot(true);
    });

    document.getElementById("convert").addEventListener("click", convert);

    // Initial load orchestration
    initCurrencies();
});
</script>
