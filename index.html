<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M€₺RIC — Universal Intelligence</title>
<!-- Dynamic SVG Favicon featuring the Turkish Lira (₺) -->
<link class="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23150022' stroke='%23a020f0' stroke-width='6'/><text y='72' x='50' font-size='60' font-weight='bold' font-family='sans-serif' fill='%23d46bff' text-anchor='middle'>₺</text></svg>">

<style>
    :root {
        --bg: #0a0014;
        --card: #150022;
        --text: #e6d6ff;
        --accent: #a020f0;
        --accent2: #d46bff;
        --slider-bg: #2a0040;
        --success: #10b981;
        --danger: #ef4444;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
    }

    .logo {
        position: absolute;
        top: 15px;
        left: 20px;
        font-size: 24px;
        font-weight: bold;
        color: var(--accent2);
        letter-spacing: 2px;
        text-shadow: 0 0 10px #a020f0;
        z-index: 10;
    }

    .container {
        display: flex;
        width: 100%;
        min-height: 100vh;
    }

    .left, .right {
        flex: 1;
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    .left {
        background: var(--card);
        border-right: 2px solid #3a0058;
        padding-top: 80px;
    }

    .right {
        padding-top: 80px;
    }

    h1 {
        margin-top: 0;
        font-size: 32px;
        text-align: center;
        color: var(--accent2);
        text-shadow: 0 0 10px #a020f0;
    }

    .slider-container {
        display: flex;
        background: var(--slider-bg);
        border-radius: 8px;
        padding: 5px;
        margin-bottom: 20px;
        position: relative;
    }

    .tab {
        flex: 1;
        text-align: center;
        padding: 10px 0;
        cursor: pointer;
        font-weight: bold;
        color: var(--text);
        z-index: 1;
        transition: color 0.3s;
        font-size: 14px;
    }

    .slider-highlight {
        position: absolute;
        top: 5px;
        bottom: 5px;
        left: 5px;
        width: calc(20% - 2px);
        background: var(--accent);
        border-radius: 6px;
        transition: transform 0.3s ease;
        z-index: 0;
    }

    .input-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
    }

    input {
        flex-grow: 1;
        width: 100%;
        padding: 14px;
        border-radius: 6px;
        border: none;
        font-size: 16px;
        background: var(--slider-bg);
        color: var(--text);
        box-sizing: border-box;
        height: 52px;
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
    }
    input[type=number] {
        -moz-appearance: textfield;
    }

    .local-helper {
        font-size: 13px;
        margin-top: -6px;
        margin-bottom: 14px;
        padding-left: 2px;
        display: none;
        align-items: center;
        gap: 6px;
        animation: fadeIn 0.3s ease-out;
    }

    .local-helper-btn {
        color: var(--accent2);
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        font-size: 13px;
        text-decoration: underline;
        cursor: pointer;
        font-weight: bold;
        width: auto;
    }

    .local-helper-btn:hover {
        color: #fff;
        background: none;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .fav-pair-btn {
        background: var(--slider-bg);
        border: 1px solid #4a1570;
        color: #553570;
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 52px;
        border-radius: 6px;
        box-sizing: border-box;
    }

    .fav-pair-btn:hover {
        border-color: var(--accent2);
        color: var(--text);
    }

    .fav-pair-btn.active {
        color: #ffb700;
        border-color: #ffb700;
        text-shadow: 0 0 10px #ffb700;
        transform: scale(1.05);
    }

    .convert-row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
    }

    .convert-btn {
        flex-grow: 1;
        margin-bottom: 0 !important;
    }

    input::-webkit-calendar-picker-indicator {
        filter: invert(1);
        opacity: 0.5;
        cursor: pointer;
    }

    button {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        color: #fff;
        margin-bottom: 12px;
        transition: 0.2s;
        font-weight: bold;
    }

    button:hover {
        background: var(--accent2);
    }

    #result {
        margin-top: 10px;
        font-size: 22px;
        text-align: center;
        color: var(--accent2);
        min-height: 26px;
        word-wrap: break-word;
    }

    .right h2 {
        margin-top: 0;
        font-size: 28px;
        color: var(--accent2);
        text-shadow: 0 0 10px #a020f0;
    }

    /* =========================================
        TRENDS SPOTLIGHT CAROUSEL
       ========================================= */
    .carousel-section {
        margin-bottom: 25px;
    }

    .carousel-title {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #9d80c0;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .carousel-outer-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        position: relative;
        background: #140224;
        border: 1px solid #33154d;
        border-radius: 12px;
        padding: 15px 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .carousel-container {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 120px;
    }

    .carousel-card {
        width: 100%;
        max-width: 240px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        cursor: pointer;
    }

    .carousel-nav-btn {
        background: var(--slider-bg);
        border: 1px solid #4a1570;
        color: var(--text);
        font-size: 20px;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        margin: 0;
        padding: 0;
    }

    .carousel-nav-btn:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent2);
        box-shadow: 0 0 8px var(--accent);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .card-currency {
        font-weight: bold;
        font-size: 16px;
        color: #fff;
    }

    .card-category-badge {
        font-size: 10px;
        text-transform: uppercase;
        background: #3a1c5c;
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--accent2);
        font-weight: bold;
    }

    .card-actions {
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .card-action-btn {
        cursor: pointer;
        background: none;
        border: none;
        padding: 2px;
        margin: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        color: #9d80c0;
        font-size: 14px;
        transition: color 0.2s;
    }

    .card-action-btn:hover {
        color: var(--accent2);
        background: none;
    }

    .card-action-btn.delete:hover {
        color: #ff3333;
    }

    .card-rate {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
    }

    .card-inverse-rate {
        font-size: 12px;
        color: #9d80c0;
        margin-bottom: 10px;
    }

    .carousel-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 8px;
    }

    .carousel-dot {
        width: 6px;
        height: 6px;
        background: #3a1c5c;
        border-radius: 50%;
        transition: background 0.3s;
        cursor: pointer;
    }

    .carousel-dot.active {
        background: var(--accent2);
        box-shadow: 0 0 6px var(--accent2);
    }

    /* =========================================
        LOGS & PERFORMANCE UTILITY CONTAINER
       ========================================= */
    .utility-box {
        margin-top: 10px;
        padding: 20px;
        background: #1d0030;
        border-radius: 10px;
        flex-grow: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        min-height: 250px;
    }

    .utility-header {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .utility-tab-btn {
        flex: 1;
        margin-bottom: 0;
        padding: 10px;
        font-size: 13px;
        background: var(--slider-bg);
        border: 1px solid #4a1570;
        color: var(--text);
        border-radius: 6px;
        cursor: pointer;
    }

    .utility-tab-btn.active {
        background: var(--accent);
        border-color: var(--accent2);
        box-shadow: 0 0 8px var(--accent);
    }

    .panel-view {
        flex-grow: 1;
        overflow-y: auto;
        font-size: 13px;
    }

    .hub-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
    }

    .hub-table th, .hub-table td {
        padding: 8px;
        text-align: left;
        border-bottom: 1px solid #33154d;
    }

    .hub-table th {
        color: var(--accent2);
        font-weight: bold;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .hub-table tr:hover {
        background: rgba(160, 32, 240, 0.1);
    }

    .hub-load-btn {
        background: var(--accent);
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 4px;
        margin: 0;
        width: auto;
        display: inline-block;
    }

    /* Real-Time Sparkline styling */
    .trend-sparkline-mini {
        width: 60px;
        height: 20px;
        stroke: var(--success);
        stroke-width: 1.5;
        fill: none;
    }

    .empty-prompt {
        padding: 20px;
        font-style: italic;
        color: #8a6da6;
        text-align: center;
    }

    /* =========================================
        MOBILE RESPONSIVENESS
       ========================================= */
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
            min-height: auto;
        }

        .left {
            border-right: none;
            border-bottom: 2px solid #3a0058;
            padding: 70px 20px 30px 20px;
        }

        .right {
            padding: 30px 20px;
        }

        .logo {
            font-size: 20px;
            width: 100%;
            text-align: center;
            left: 0;
            top: 15px;
            background: rgba(10, 0, 20, 0.9);
            padding: 10px 0;
            backdrop-filter: blur(5px);
        }

        .tab {
            font-size: 12px;
            padding: 8px 0;
        }
    }
</style>
</head>

<body>

<div class="logo">M€₺RIC by LUXWORLD+</div>

<div class="container">

    <div class="left">
        <h1 id="mainTitle">Currency Converter</h1>

        <div class="slider-container">
            <div class="slider-highlight" id="sliderHighlight"></div>
            <div class="tab" onclick="setCategory('Currency', 0)">Currency</div>
            <div class="tab" onclick="setCategory('Length', 1)">Length</div>
            <div class="tab" onclick="setCategory('Weight', 2)">Weight</div>
            <div class="tab" onclick="setCategory('Volume', 3)">Volume</div>
            <div class="tab" onclick="setCategory('Temp', 4)">Temp</div>
        </div>

        <!-- Wrapped in input-row to match layouts -->
        <div class="input-row">
            <input id="amount" type="number" placeholder="Amount">
        </div>
        
        <div class="input-row">
            <input id="from" list="fromList" placeholder="From (Type to search)">
            <datalist id="fromList"></datalist>
        </div>

        <div class="local-helper" id="localHelper">
            <span style="color: #9d80c0;">Not your local currency?</span>
            <button id="useDetectedLocalCurrency" class="local-helper-btn">Change it to <span id="detectedLocalCode">USD</span></button>
        </div>

        <div class="input-row">
            <input id="to" list="toList" placeholder="To (Type to search)">
            <datalist id="toList"></datalist>
        </div>

        <div class="convert-row">
            <button id="convert" class="convert-btn">Convert</button>
            <button id="swapBtn" class="fav-pair-btn" title="Swap From and To inputs">⇅</button>
            <button id="favPairBtn" class="fav-pair-btn" title="Add this exact pair to your favorites">★</button>
        </div>

        <div id="result"></div>
    </div>

    <div class="right">
        <!-- TRENDS SPOTLIGHT CAROUSEL -->
        <div class="carousel-section">
            <div class="carousel-title">
                <span>Favorite Custom Trends</span>
                <span id="carouselTimerLabel" style="font-size: 11px; opacity: 0.7;">Active live rates</span>
            </div>
            
            <div class="carousel-outer-wrapper">
                <button class="carousel-nav-btn" id="carouselPrevBtn" title="Previous Trend">&lsaquo;</button>
                
                <div class="carousel-container" id="carouselContainer">
                    <!-- Dynamically populated spotlight card -->
                </div>

                <button class="carousel-nav-btn" id="carouselNextBtn" title="Next Trend">&rsaquo;</button>
            </div>
            
            <div class="carousel-dots" id="carouselDots">
                <!-- Dot indicator tags -->
            </div>
        </div>

        <h2 id="hubTitle">Performance & Logs</h2>

        <div class="utility-box">
            <div class="utility-header">
                <button id="tabFavorites" class="utility-tab-btn active">📋 Registry & Inverses</button>
                <button id="tabHistory" class="utility-tab-btn">🕒 Session History (Last 7)</button>
            </div>
            <div class="panel-view" id="panelView">
                <!-- Swapped dynamic content displays here -->
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const API = "https://open.er-api.com/v6/latest/";
    
    // UI Elements
    const fromInput = document.getElementById("from");
    const toInput = document.getElementById("to");
    const fromList = document.getElementById("fromList");
    const toList = document.getElementById("toList");
    const amountInput = document.getElementById("amount");
    const resultBox = document.getElementById("result");
    const mainTitle = document.getElementById("mainTitle");
    const sliderHighlight = document.getElementById("sliderHighlight");
    const carouselContainer = document.getElementById("carouselContainer");
    const carouselDots = document.getElementById("carouselDots");
    const carouselPrevBtn = document.getElementById("carouselPrevBtn");
    const carouselNextBtn = document.getElementById("carouselNextBtn");
    const favPairBtn = document.getElementById("favPairBtn");
    const swapBtn = document.getElementById("swapBtn");
    const localHelper = document.getElementById("localHelper");
    const detectedLocalCodeSpan = document.getElementById("detectedLocalCode");
    const useDetectedLocalCurrencyBtn = document.getElementById("useDetectedLocalCurrency");
    
    const tabFavorites = document.getElementById("tabFavorites");
    const tabHistory = document.getElementById("tabHistory");
    const panelView = document.getElementById("panelView");

    let currentCategory = localStorage.getItem("metric_category") || "Currency";
    let currencyList = [];
    let latestRates = {}; // Store USD base rates for global calculations
    let detectedLocalCurrency = "USD"; // Holds geo-IP detected currency

    // Empty favorites by default - filter out any legacy non-currencies if there are any
    let rawFavorites = JSON.parse(localStorage.getItem("metric_favorites_pairs")) || [];
    let favorites = rawFavorites.filter(key => key.includes("|") && key.startsWith("Currency|"));
    localStorage.setItem("metric_favorites_pairs", JSON.stringify(favorites));

    // Session log of last 7 opens
    let sessionHistory = JSON.parse(localStorage.getItem("metric_session_history")) || [];

    let currentTrendIndex = 0;
    let autoplayInterval = null;
    let activeHubTab = "favorites"; // "favorites" or "history"

    // Conversion Data
    const units = {
        Length: {
            "Meters": 1,
            "Kilometers": 1000,
            "Centimeters": 0.01,
            "Millimeters": 0.001,
            "Micrometers": 0.000001,
            "Nanometers": 0.000000001,
            "Miles": 1609.344,
            "Yards": 0.9144,
            "Feet": 0.3048,
            "Inches": 0.0254,
            "Nautical Miles": 1852,
            "Light Years": 9460730472580800
        },
        Weight: {
            "Kilograms": 1,
            "Grams": 0.001,
            "Milligrams": 0.000001,
            "Micrograms": 0.000000001,
            "Metric Tons": 1000,
            "Pounds": 0.453592,
            "Ounces": 0.0283495,
            "Stone": 6.35029,
            "Carats": 0.0002
        },
        Volume: {
            "Liters": 1,
            "Milliliters": 0.001,
            "Cubic Meters": 1000,
            "US Gallons": 3.78541,
            "US Quarts": 0.946353,
            "US Pints": 0.473176,
            "US Cups": 0.24,
            "US Fluid Ounces": 0.0295735,
            "UK Gallons": 4.54609
        },
        Temp: ["Celsius", "Fahrenheit", "Kelvin"]
    };

    const categoryIndexes = {
        "Currency": 0,
        "Length": 1,
        "Weight": 2,
        "Volume": 3,
        "Temp": 4
    };

    function saveState() {
        localStorage.setItem("metric_category", currentCategory);
        localStorage.setItem("metric_amount", amountInput.value);
        localStorage.setItem(`metric_from_${currentCategory}`, fromInput.value);
        localStorage.setItem(`metric_to_${currentCategory}`, toInput.value);
    }

    function populateSelects(list, defaultFrom, defaultTo) {
        fromList.innerHTML = "";
        toList.innerHTML = "";
        list.forEach(item => {
            fromList.innerHTML += `<option value="${item}"></option>`;
            toList.innerHTML += `<option value="${item}"></option>`;
        });
        fromInput.value = defaultFrom || list[0];
        toInput.value = defaultTo || list[1] || list[0];
    }

    function evalLocalCurrencyShortcut() {
        if (currentCategory === "Currency" && fromInput.value !== detectedLocalCurrency) {
            detectedLocalCodeSpan.textContent = detectedLocalCurrency;
            localHelper.style.display = "flex";
        } else {
            localHelper.style.display = "none";
        }
    }

    function getPairKey(category, fromUnit, toUnit) {
        return `${category}|${fromUnit}|${toUnit}`;
    }

    function parsePairKey(key) {
        const parts = key.split("|");
        return {
            category: parts[0],
            from: parts[1],
            to: parts[2]
        };
    }

    function updateFavoriteStars() {
        const fromVal = fromInput.value;
        const toVal = toInput.value;
        const currentKey = getPairKey(currentCategory, fromVal, toVal);

        // Star button is only functional and shown in currency mode
        if (currentCategory === "Currency") {
            favPairBtn.style.display = "flex";
            if (favorites.includes(currentKey)) {
                favPairBtn.classList.add("active");
            } else {
                favPairBtn.classList.remove("active");
            }
        } else {
            favPairBtn.style.display = "none";
        }
    }

    function toggleFavoriteCurrentPair() {
        // Users can only favorite Currency
        if (currentCategory !== "Currency") return;

        const fromVal = fromInput.value;
        const toVal = toInput.value;
        if (!fromVal || !toVal) return;

        const key = getPairKey(currentCategory, fromVal, toVal);
        const idx = favorites.indexOf(key);

        if (idx > -1) {
            favorites.splice(idx, 1);
            if (currentTrendIndex >= favorites.length && favorites.length > 0) {
                currentTrendIndex = favorites.length - 1;
            }
        } else {
            favorites.push(key);
            currentTrendIndex = favorites.length - 1;
        }

        localStorage.setItem("metric_favorites_pairs", JSON.stringify(favorites));
        updateFavoriteStars();
        renderTrendsCarousel();
        renderActivePanel();
        setupAutoplay();
    }

    function calculateLiveRate(category, from, to) {
        if (category === "Currency") {
            if (!latestRates[from] || !latestRates[to]) return "N/A";
            return (latestRates[to] / latestRates[from]).toFixed(4);
        } else if (category === "Temp") {
            return "Convertible";
        } else {
            const baseRates = units[category];
            if (!baseRates || !baseRates[from] || !baseRates[to]) return "N/A";
            const rate = baseRates[from] / baseRates[to];
            return rate < 0.001 ? rate.toExponential(4) : rate.toFixed(4);
        }
    }

    function generateRealHistorySparkline(favKey) {
        // Gather historical rates from session snapshots from oldest to newest
        let historyRates = sessionHistory
            .slice()
            .reverse()
            .map(s => parseFloat(s.rates[favKey]))
            .filter(val => !isNaN(val) && isFinite(val));

        const fallbackRate = parseFloat(calculateLiveRate("Currency", parsePairKey(favKey).from, parsePairKey(favKey).to));

        // If we have less than 2 data points, inject the fallback rate to make a stable flat line
        if (historyRates.length === 0) {
            historyRates = [fallbackRate, fallbackRate];
        } else if (historyRates.length === 1) {
            historyRates.unshift(historyRates[0]);
        }

        const latest = historyRates[historyRates.length - 1];
        const oldest = historyRates[0];
        const isUp = latest >= oldest;

        const minY = Math.min(...historyRates);
        const maxY = Math.max(...historyRates);
        const range = maxY - minY || 1;

        // Scale coordinates to fit viewBox="0 0 100 25"
        const points = historyRates.map((rate, i) => {
            const x = (i / (historyRates.length - 1)) * 100;
            const y = 22 - ((rate - minY) / range) * 19; // Bound y with comfortable cushion inside 25px height
            return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(" ");

        return { points, isUp };
    }

    function setupAutoplay() {
        clearInterval(autoplayInterval);
        if (favorites.length > 1) {
            autoplayInterval = setInterval(() => {
                navigateTrends(1);
            }, 10000); 
        }
    }

    function navigateTrends(direction) {
        if (favorites.length === 0) return;
        currentTrendIndex = (currentTrendIndex + direction + favorites.length) % favorites.length;
        renderTrendsCarousel();
    }

    function handleManualNavigation(direction) {
        navigateTrends(direction);
        setupAutoplay();
    }

    function invertFavoritePair(key) {
        const { category, from, to } = parsePairKey(key);
        const newKey = getPairKey(category, to, from);
        
        const idx = favorites.indexOf(key);
        if (idx > -1) {
            favorites[idx] = newKey;
            localStorage.setItem("metric_favorites_pairs", JSON.stringify(favorites));
            updateFavoriteStars();
            renderTrendsCarousel();
            renderActivePanel();
        }
    }

    function renderTrendsCarousel() {
        carouselContainer.innerHTML = "";
        carouselDots.innerHTML = "";

        if (favorites.length === 0) {
            carouselContainer.innerHTML = `
                <div class="empty-prompt">
                    No active trends. Star currency conversions below to track rates!
                </div>
            `;
            carouselPrevBtn.style.opacity = "0.3";
            carouselPrevBtn.style.pointerEvents = "none";
            carouselNextBtn.style.opacity = "0.3";
            carouselNextBtn.style.pointerEvents = "none";
            return;
        }

        carouselPrevBtn.style.opacity = "1";
        carouselPrevBtn.style.pointerEvents = "auto";
        carouselNextBtn.style.opacity = "1";
        carouselNextBtn.style.pointerEvents = "auto";

        if (currentTrendIndex >= favorites.length) {
            currentTrendIndex = 0;
        }

        const favKey = favorites[currentTrendIndex];
        const { category, from, to } = parsePairKey(favKey);
        const liveRate = calculateLiveRate(category, from, to);
        const inverseRate = calculateLiveRate(category, to, from);

        // Fetch the real trend slope built on the user's logged open sessions
        const trendData = generateRealHistorySparkline(favKey);

        const card = document.createElement("div");
        card.className = "carousel-card";
        
        card.innerHTML = `
            <div class="card-header">
                <span class="card-currency">${from} / ${to}</span>
                <span class="card-category-badge">${category}</span>
                <div class="card-actions">
                    <button class="card-action-btn invert-btn" title="Invert this pair">⇅</button>
                    <button class="card-action-btn delete" title="Remove favorite">×</button>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <div class="card-rate">1 ${from} = ${liveRate}</div>
                    <div class="card-inverse-rate">1 ${to} = ${inverseRate}</div>
                </div>
                <!-- Interactive SVG slope demonstrating real trajectory changes -->
                <svg viewBox="0 0 100 25" style="width: 80px; height: 24px; margin-bottom: 8px;">
                    <polyline points="${trendData.points}" style="fill:none; stroke:${trendData.isUp ? 'var(--success)' : 'var(--danger)'}; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 1.5px ${trendData.isUp ? 'var(--success)' : 'var(--danger)'})"></polyline>
                </svg>
            </div>
        `;

        card.querySelector(".delete").addEventListener("click", (e) => {
            e.stopPropagation();
            toggleFavoriteByKey(favKey);
        });

        card.querySelector(".invert-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            invertFavoritePair(favKey);
        });

        card.addEventListener("click", () => {
            const activeIndex = categoryIndexes[category] ?? 0;
            setCategory(category, activeIndex, false);
            populateSelects(category === "Currency" ? currencyList : (category === "Temp" ? units.Temp : Object.keys(units[category])), from, to);
            saveState();
            updateFavoriteStars();
            evalLocalCurrencyShortcut();
            if (amountInput.value) {
                convert();
            }
        });

        carouselContainer.appendChild(card);

        favorites.forEach((_, idx) => {
            const dot = document.createElement("div");
            dot.className = `carousel-dot ${idx === currentTrendIndex ? 'active' : ''}`;
            dot.addEventListener("click", () => {
                currentTrendIndex = idx;
                renderTrendsCarousel();
                setupAutoplay();
            });
            carouselDots.appendChild(dot);
        });
    }

    function toggleFavoriteByKey(key) {
        const idx = favorites.indexOf(key);
        if (idx > -1) {
            favorites.splice(idx, 1);
            if (currentTrendIndex >= favorites.length && favorites.length > 0) {
                currentTrendIndex = favorites.length - 1;
            }
        }
        localStorage.setItem("metric_favorites_pairs", JSON.stringify(favorites));
        updateFavoriteStars();
        renderTrendsCarousel();
        renderActivePanel();
        setupAutoplay();
    }

    window.setCategory = function(cat, index, clearInputs = true) {
        currentCategory = cat;
        sliderHighlight.style.transform = `translateX(${index * 100}%)`;
        resultBox.textContent = "";
        
        if (clearInputs) {
            amountInput.value = "";
        }

        const savedFrom = localStorage.getItem(`metric_from_${cat}`);
        const savedTo = localStorage.getItem(`metric_to_${cat}`);

        if (cat === "Currency") {
            mainTitle.textContent = "Currency Converter";
            populateSelects(currencyList, savedFrom || detectedLocalCurrency, savedTo || "EUR");
            evalLocalCurrencyShortcut();
        } else {
            localHelper.style.display = "none";
            if (cat === "Length") {
                mainTitle.textContent = "Length Converter";
                populateSelects(Object.keys(units.Length), savedFrom || "Meters", savedTo || "Feet");
            } else if (cat === "Weight") {
                mainTitle.textContent = "Weight Converter";
                populateSelects(Object.keys(units.Weight), savedFrom || "Kilograms", savedTo || "Pounds");
            } else if (cat === "Volume") {
                mainTitle.textContent = "Volume Converter";
                populateSelects(Object.keys(units.Volume), savedFrom || "Liters", savedTo || "US Gallons");
            } else if (cat === "Temp") {
                mainTitle.textContent = "Temperature Converter";
                populateSelects(units.Temp, savedFrom || "Celsius", savedTo || "Fahrenheit");
            }
        }

        saveState();
        updateFavoriteStars();
    }

    async function convert() {
        const amount = parseFloat(amountInput.value);
        if (isNaN(amount)) return resultBox.textContent = "Enter a valid amount";

        const from = fromInput.value;
        const to = toInput.value;
        let converted = 0;

        if (currentCategory === "Currency") {
            if (!currencyList.includes(from) || !currencyList.includes(to)) {
                return resultBox.textContent = "Please select valid currency codes.";
            }
            try {
                const res = await fetch(API + from);
                const data = await res.json();
                const rate = data.rates[to];
                if (!rate) throw new Error("Invalid rate");
                converted = amount * rate;
            } catch {
                return resultBox.textContent = "Conversion API Error.";
            }
        } 
        else if (currentCategory === "Length" || currentCategory === "Weight" || currentCategory === "Volume") {
            const baseRates = units[currentCategory];
            if (!baseRates[from] || !baseRates[to]) {
                return resultBox.textContent = "Please select valid units from the dropdown.";
            }
            const valInBase = amount * baseRates[from]; 
            converted = valInBase / baseRates[to];      
        } 
        else if (currentCategory === "Temp") {
            if (!units.Temp.includes(from) || !units.Temp.includes(to)) {
                return resultBox.textContent = "Please select valid temperatures.";
            }
            if (from === to) converted = amount;
            else if (from === "Celsius" && to === "Fahrenheit") converted = (amount * 9/5) + 32;
            else if (from === "Celsius" && to === "Kelvin") converted = amount + 273.15;
            else if (from === "Fahrenheit" && to === "Celsius") converted = (amount - 32) * 5/9;
            else if (from === "Fahrenheit" && to === "Kelvin") converted = (amount - 32) * 5/9 + 273.15;
            else if (from === "Kelvin" && to === "Celsius") converted = amount - 273.15;
            else if (from === "Kelvin" && to === "Fahrenheit") converted = (amount - 273.15) * 9/5 + 32;
        }

        let formattedStr = converted;
        if (currentCategory === "Currency") {
            formattedStr = converted.toFixed(2);
        } else {
            formattedStr = Math.round(converted * 100000000) / 100000000;
        }

        resultBox.textContent = `${amount} ${from} = ${formattedStr} ${to}`;
        saveState();
    }

    async function detectLocalCurrency() {
        try {
            const res = await fetch("https://ipapi.co/json/");
            if (!res.ok) throw new Error("Geo IP service unreachable");
            const data = await res.json();
            if (data && data.currency) {
                return data.currency;
            }
        } catch (err) {
            console.warn("Could not determine local currency via IP, using standard fallback:", err);
        }
        return "USD";
    }

    function recordSessionSnapshot() {
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = new Date().toLocaleDateString([], { month: 'short', day: 'numeric' });
        
        const snapshot = {
            sessionLabel: `${dateStr} @ ${timeStr}`,
            rates: {}
        };

        // Record current conversion rates for each favorite pair
        favorites.forEach(favKey => {
            const { category, from, to } = parsePairKey(favKey);
            snapshot.rates[favKey] = calculateLiveRate(category, from, to);
        });

        // Robust duplicate session logger filtering out identical loads/static values
        if (sessionHistory.length > 0) {
            const lastSession = sessionHistory[0];
            
            // Compare list of tracked keys to check if composition is identical
            const lastKeys = Object.keys(lastSession.rates || {});
            const currentKeys = Object.keys(snapshot.rates);
            const keysChanged = lastKeys.length !== currentKeys.length || !currentKeys.every(k => lastKeys.includes(k));

            let rateChanged = false;

            if (keysChanged) {
                rateChanged = true;
            } else {
                for (const favKey of favorites) {
                    const prevVal = parseFloat(lastSession.rates[favKey]);
                    const newVal = parseFloat(snapshot.rates[favKey]);

                    // Check if the change is non-zero (greater than 0.0000 range)
                    if (!isNaN(prevVal) && !isNaN(newVal)) {
                        if (Math.abs(newVal - prevVal) > 0.00001) {
                            rateChanged = true;
                            break;
                        }
                    } else if (isNaN(prevVal) && !isNaN(newVal)) {
                        // Protect against migrations or undefined entries (new favorites)
                        rateChanged = true;
                        break;
                    }
                }
            }

            // If rates are completely static across all favorites, skip recording this duplicate snapshot!
            if (!rateChanged && favorites.length > 0) {
                console.log("Ignored identical session to protect historical logs from duplicate opens.");
                return;
            }
        }

        sessionHistory.unshift(snapshot);
        if (sessionHistory.length > 7) {
            sessionHistory = sessionHistory.slice(0, 7);
        }

        localStorage.setItem("metric_session_history", JSON.stringify(sessionHistory));
    }

    function renderActivePanel() {
        panelView.innerHTML = "";
        
        if (activeHubTab === "favorites") {
            tabFavorites.classList.add("active");
            tabHistory.classList.remove("active");

            if (favorites.length === 0) {
                panelView.innerHTML = `<div class="empty-prompt">No custom favorite registry items are currently tracked.</div>`;
                return;
            }

            const table = document.createElement("table");
            table.className = "hub-table";
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Saved Unit Pair</th>
                        <th>Direct Value</th>
                        <th>Inverse Value</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="favTableBody"></tbody>
            `;

            panelView.appendChild(table);
            const tbody = document.getElementById("favTableBody");

            favorites.forEach(favKey => {
                const { category, from, to } = parsePairKey(favKey);
                const directVal = calculateLiveRate(category, from, to);
                const inverseVal = calculateLiveRate(category, to, from);

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td style="font-weight:bold; color:var(--text);">${from} ➔ ${to}</td>
                    <td>1 = ${directVal}</td>
                    <td>1 = ${inverseVal}</td>
                    <td><button class="hub-load-btn" data-key="${favKey}">Load</button></td>
                `;

                row.querySelector(".hub-load-btn").addEventListener("click", () => {
                    const activeIndex = categoryIndexes[category] ?? 0;
                    setCategory(category, activeIndex, false);
                    populateSelects(category === "Currency" ? currencyList : (category === "Temp" ? units.Temp : Object.keys(units[category])), from, to);
                    saveState();
                    updateFavoriteStars();
                    evalLocalCurrencyShortcut();
                });

                tbody.appendChild(row);
            });

        } else if (activeHubTab === "history") {
            tabFavorites.classList.remove("active");
            tabHistory.classList.add("active");

            if (favorites.length === 0) {
                panelView.innerHTML = `<div class="empty-prompt">No saved favorite pairs. Star conversions to log loading trends.</div>`;
                return;
            }

            if (sessionHistory.length === 0) {
                panelView.innerHTML = `<div class="empty-prompt">No session logs captured. Reload the app to capture loading points.</div>`;
                return;
            }

            const table = document.createElement("table");
            table.className = "hub-table";
            
            // Build columns for each favorite pair currently tracked
            let headerCells = `<th>Session Landmark</th>`;
            favorites.forEach(favKey => {
                const { from, to } = parsePairKey(favKey);
                headerCells += `<th>${from}/${to}</th>`;
            });

            table.innerHTML = `
                <thead>
                    <tr>${headerCells}</tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            `;

            panelView.appendChild(table);
            const tbody = document.getElementById("historyTableBody");

            sessionHistory.forEach(session => {
                const row = document.createElement("tr");
                let cells = `<td style="font-size:11px; opacity:0.8;">${session.sessionLabel}</td>`;
                
                favorites.forEach(favKey => {
                    const currentRecordedRate = (session.rates && session.rates[favKey] !== undefined) 
                        ? session.rates[favKey] 
                        : calculateLiveRate(parsePairKey(favKey).category, parsePairKey(favKey).from, parsePairKey(favKey).to);
                    cells += `<td>${currentRecordedRate}</td>`;
                });

                row.innerHTML = cells;
                tbody.appendChild(row);
            });
        }
    }

    async function initCurrencies() {
        try {
            const res = await fetch(API + "USD");
            const data = await res.json();
            currencyList = Object.keys(data.rates);
            latestRates = data.rates;

            const savedFrom = localStorage.getItem(`metric_from_${currentCategory}`);
            const savedTo = localStorage.getItem(`metric_to_${currentCategory}`);
            const savedAmount = localStorage.getItem("metric_amount");

            if (savedAmount) amountInput.value = savedAmount;

            detectedLocalCurrency = await detectLocalCurrency();
            if (!currencyList.includes(detectedLocalCurrency)) {
                detectedLocalCurrency = "USD";
            }

            let initialFrom = savedFrom;
            
            if (!initialFrom && currentCategory === "Currency") {
                initialFrom = detectedLocalCurrency;
            } else if (!initialFrom) {
                initialFrom = currentCategory === "Length" ? "Meters" :
                              currentCategory === "Weight" ? "Kilograms" :
                              currentCategory === "Volume" ? "Liters" : "Celsius";
            }

            const activeIndex = categoryIndexes[currentCategory] ?? 0;
            setCategory(currentCategory, activeIndex, false); 

            if (currentCategory === "Currency") {
                populateSelects(currencyList, initialFrom, savedTo || "EUR");
                evalLocalCurrencyShortcut();
            }

            // Capture snapshot load points (with robust duplicates removal logic)
            recordSessionSnapshot();

            updateFavoriteStars();
            renderTrendsCarousel();
            renderActivePanel();
            setupAutoplay();

        } catch (e) {
            resultBox.textContent = "Error loading currencies. Check network connection.";
        }
    }

    useDetectedLocalCurrencyBtn.addEventListener("click", () => {
        fromInput.value = detectedLocalCurrency;
        saveState();
        evalLocalCurrencyShortcut();
        updateFavoriteStars();
        if (amountInput.value) {
            convert();
        }
    });

    swapBtn.addEventListener("click", () => {
        const temp = fromInput.value;
        fromInput.value = toInput.value;
        toInput.value = temp;
        saveState();
        updateFavoriteStars();
        evalLocalCurrencyShortcut();
        if (amountInput.value) {
            convert();
        }
    });

    amountInput.addEventListener("input", saveState);
    fromInput.addEventListener("input", () => {
        saveState();
        updateFavoriteStars();
        evalLocalCurrencyShortcut();
    });
    toInput.addEventListener("input", () => {
        saveState();
        updateFavoriteStars();
    });

    favPairBtn.addEventListener("click", toggleFavoriteCurrentPair);
    carouselPrevBtn.addEventListener("click", () => handleManualNavigation(-1));
    carouselNextBtn.addEventListener("click", () => handleManualNavigation(1));

    tabFavorites.addEventListener("click", () => {
        activeHubTab = "favorites";
        renderActivePanel();
    });

    tabHistory.addEventListener("click", () => {
        activeHubTab = "history";
        renderActivePanel();
    });

    document.getElementById("convert").addEventListener("click", convert);

    // Initial load orchestration
    initCurrencies();
});
</script>
